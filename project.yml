name: YPlayer
options:
  bundleIdPrefix: com.YPlayer
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "15.0"
    macOS: "13.0"
  xcodeVersion: "26.6"
  minimumXcodeGenVersion: "2.38.0"

attributes:
  ORGANIZATIONNAME: YPlayer
  LastUpgradeCheck: "2660"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_MODULE_VERIFIER: NO

packages:
  CatVodCore:
    path: Packages/CatVodCore
  CatVodNet:
    path: Packages/CatVodNet
  CatVodSource:
    path: Packages/CatVodSource
  CatVodPlayer:
    path: Packages/CatVodPlayer
  CatVodStore:
    path: Packages/CatVodStore
  CatVodUI:
    path: Packages/CatVodUI

targets:
  YPlayer-iOS:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Apps/YPlayer-iOS
    dependencies:
      - package: CatVodCore
      - package: CatVodNet
      - package: CatVodSource
      - package: CatVodPlayer
      - package: CatVodStore
      - package: CatVodUI
      # 内嵌 Node 运行时（iOS）：随包 NodeMobile.xcframework。
      # 该产物不入库，先跑 `python Scripts/fetch_nodejs_mobile.py` 取回（CI 已内置该步骤）。
      - framework: ThirdParty/nodejs-mobile/NodeMobile.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.YPlayer.cat
        PRODUCT_NAME: YPlayer
        INFOPLIST_KEY_CFBundleDisplayName: YPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Apps/YPlayer-iOS/Info.plist
      properties:
        CFBundleDisplayName: YPlayer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: 用于局域网投屏与远程托管功能。
        NSBonjourServices:
          - _yplayer._tcp
          - _http._tcp

  YPlayer-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Apps/YPlayer-macOS
    dependencies:
      - package: CatVodCore
      - package: CatVodNet
      - package: CatVodSource
      - package: CatVodPlayer
      - package: CatVodStore
      - package: CatVodUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.YPlayer.cat
        PRODUCT_NAME: YPlayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Apps/YPlayer-macOS/Info.plist
      properties:
        CFBundleDisplayName: YPlayer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.entertainment
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: 用于局域网投屏与远程托管功能。

  # iOS 单元测试 target：**在模拟器里真的跑起来**，而不只是编译。
  #
  # 为什么必须有它：CI 只编译时会漏掉两类问题 ——
  #   1) 动态库没被正确嵌入（App 启动即 `dyld: Library not loaded`）；
  #   2) 内嵌 Node（libnode）在真实 iOS 运行时里能否起来、能否打印就绪行。
  # 这两件事「运行」才知道，而 GitHub 的 macOS runner 自带 iOS 模拟器。
  YPlayer-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/YPlayer-iOSTests
    dependencies:
      - target: YPlayer-iOS
      # 只列测试里**真正 import** 的包产品：
      # `CatVodNode` 不在这里 —— 它既没被测试直接引用，也没在根 `packages:` 里声明，
      # 直接写会让 XcodeGen 报 "invalid package dependency"（CI 抓过一次 ✗）。
      - package: CatVodCore
      - package: CatVodNet
      - package: CatVodSource
      - package: CatVodPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.YPlayer.cat.tests
        # 宿主 App：单元测试在 App 进程里跑，因此 App 启动失败（缺 dylib）测试也会失败 —— 这正是我们要的信号。
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/YPlayer.app/YPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic

schemes:
  YPlayer-iOS:
    build:
      targets:
        YPlayer-iOS: all
        YPlayer-iOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YPlayer-iOSTests
    archive:
      config: Release
  YPlayer-macOS:
    build:
      targets:
        YPlayer-macOS: all
    run:
      config: Debug
    archive:
      config: Release
