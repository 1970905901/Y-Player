# 临时诊断工作流（用完即删）：把 SwiftFormat 的改动与编译错误变成 annotations。
#
# 背景：CI 的 lint / tests 作业只把细节写进 job 日志，而 job 日志要登录才能看；
# annotations 是匿名可见的。本机又是 Windows（没有 Swift 工具链），所以「编译报什么错」
# 只能靠这条路带回来。
name: format-report

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_VERSION: "16.4"

jobs:
  report:
    name: SwiftFormat report
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install SwiftFormat
        run: brew install swiftformat && swiftformat --version
      - name: Report what would change
        run: python3 Scripts/format_report.py

