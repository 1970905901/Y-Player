name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"
  SCHEME_IOS: YPlayer-iOS
  SCHEME_MACOS: YPlayer-macOS

jobs:
  lint:
    name: Lint (SwiftLint / SwiftFormat)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swiftlint version || true
          swiftformat --version || true
      - name: Install linters
        run: |
          brew install swiftformat swiftlint
          swiftformat --version
          swiftlint version
      - name: SwiftFormat (阻断：仓库已全量格式化，0 违规)
        run: |
          swiftformat --lint . --config .swiftformat \
            --exclude .build,DerivedData,ThirdParty,Tools,.swiftpm,Packages/*/.build
      - name: SwiftLint (阻断：当前 0 违规)
        run: swiftlint lint --config .swiftlint.yml

  core-tests:
    name: SwiftPM tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: CatVodCore tests
        run: swift test --package-path Packages/CatVodCore
      - name: CatVodNet tests
        run: swift test --package-path Packages/CatVodNet
      - name: CatVodSource tests
        run: swift test --package-path Packages/CatVodSource
      - name: CatVodPlayer tests
        run: swift test --package-path Packages/CatVodPlayer
      - name: CatVodStore tests
        run: swift test --package-path Packages/CatVodStore
      # CatVodUI 没有单测目标，只靠 Xcode 构建把关会漏掉缺 import 之类的低级错误，
      # 这里加一次编译（macOS 平台）作为快速信号。
      - name: CatVodUI (build only)
        run: swift build --package-path Packages/CatVodUI
      - name: CatVodNode tests
        run: swift test --package-path Packages/CatVodNode

  build:
    name: Build apps (unsigned)
    runs-on: macos-15
    needs: [core-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Cache nodejs-mobile (embedded Node runtime)
        uses: actions/cache@v4
        with:
          path: ThirdParty/.cache
          key: nodejs-mobile-v18.20.4-8c5ca3a0d1e38de7
      - name: Fetch embedded Node runtime (iOS) and generate project
        run: |
          python3 Scripts/fetch_nodejs_mobile.py
          xcodegen generate
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build iOS (simulator, unsigned)
        run: |
          xcodebuild build \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_IOS" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Build macOS (unsigned)
        run: |
          xcodebuild build \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_MACOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  # 在 iOS 模拟器里**真的跑起来**：验证动态库嵌入（否则启动即 dyld 缺库）、
  # 内嵌 Node（libnode）能否就绪、以及内核可用性语义是否如实。
  # 这是唯一能覆盖「只编译会漏掉」那类问题的作业 —— 也是「没有 Mac」时最接近真机的验证。
  simulator-tests:
    name: iOS simulator tests
    runs-on: macos-15
    needs: [core-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Cache nodejs-mobile (embedded Node runtime)
        uses: actions/cache@v4
        with:
          path: ThirdParty/.cache
          key: nodejs-mobile-v18.20.4-8c5ca3a0d1e38de7
      - name: Fetch embedded Node runtime (iOS) and generate project
        run: |
          python3 Scripts/fetch_nodejs_mobile.py
          xcodegen generate
      - name: Run tests on an iPhone simulator
        run: |
          DEVICE_ID=$(bash Scripts/pick_simulator.sh)
          echo "simulator=$DEVICE_ID"
          xcodebuild test \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_IOS" \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  release:
    name: Release (unsigned ipa / mac app)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Cache nodejs-mobile (embedded Node runtime)
        uses: actions/cache@v4
        with:
          path: ThirdParty/.cache
          key: nodejs-mobile-v18.20.4-8c5ca3a0d1e38de7
      - name: Fetch embedded Node runtime (iOS) and generate project
        run: |
          python3 Scripts/fetch_nodejs_mobile.py
          xcodegen generate
      - name: Archive iOS (unsigned)
        run: |
          xcodebuild archive \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_IOS" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/YPlayer-iOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/YPlayer-iOS.xcarchive/Products/Applications/YPlayer.app build/Payload/
          cd build && zip -qry YPlayer-unsigned.ipa Payload
      - name: Build macOS app (unsigned)
        run: |
          xcodebuild build \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_MACOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd build/DerivedData/Build/Products/Release && zip -qry ../../../YPlayer-macOS-unsigned.zip YPlayer.app
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YPlayer-${{ github.ref_name }}
          path: |
            build/YPlayer-unsigned.ipa
            build/YPlayer-macOS-unsigned.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/YPlayer-unsigned.ipa
            build/YPlayer-macOS-unsigned.zip
          body: |
            未签名构建产物（非 App Store 分发）。

            - `YPlayer-unsigned.ipa`：iOS/iPadOS，需自行侧载并重签
            - `YPlayer-macOS-unsigned.zip`：macOS 13+，首次打开需右键“打开”

            本仓库不内置任何影视源，所有接口由使用者自行添加，责任自负。
