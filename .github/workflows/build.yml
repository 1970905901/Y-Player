name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"
  SCHEME_IOS: YPlayer-iOS
  SCHEME_MACOS: YPlayer-macOS

jobs:
  lint:
    name: Lint (SwiftLint / SwiftFormat)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swiftlint version || true
          swiftformat --version || true
      - name: Install linters
        run: |
          brew install swiftformat swiftlint
          swiftformat --version
          swiftlint version
      - name: SwiftFormat (阻断：仓库已全量格式化，0 违规)
        run: |
          swiftformat --lint . --config .swiftformat \
            --exclude .build,DerivedData,ThirdParty,Tools,.swiftpm,Packages/*/.build
      - name: SwiftLint (阻断：当前 0 违规)
        run: swiftlint lint --config .swiftlint.yml
      # 图标资源校验：actool 对「缺文件/尺寸不符」是硬报错，但对 iOS 图标带 alpha **只警告**，
      # 很容易带着问题进包（等 App Store 上传被拒才发现）。纯标准库实现，无需 Pillow。
      - name: App icon assets (阻断：清单/尺寸/alpha 通道)
        run: python3 Scripts/check_app_icons.py

  core-tests:
    name: SwiftPM tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: CatVodCore tests
        run: swift test --package-path Packages/CatVodCore
      - name: CatVodNet tests
        run: swift test --package-path Packages/CatVodNet
      - name: CatVodSource tests
        run: swift test --package-path Packages/CatVodSource
      - name: CatVodPlayer tests
        run: swift test --package-path Packages/CatVodPlayer
      - name: CatVodStore tests
        run: swift test --package-path Packages/CatVodStore
      # CatVodUI 以前这里只做 `swift build`（注释还写着「没有单测目标」，早已不准）——
      # 于是 `CatVodUITests` 里那些纯逻辑用例（M02P12/P13/P14、M07c、M08b 陆续加的）
      # **从来没在 CI 里编译过**，写错也看不见。这里改成真的跑单测（顺带也完成同样的编译）。
      - name: CatVodUI tests
        run: swift test --package-path Packages/CatVodUI
      - name: CatVodNode tests
        run: swift test --package-path Packages/CatVodNode

  build:
    name: Build apps (unsigned)
    runs-on: macos-15
    needs: [core-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Cache nodejs-mobile (embedded Node runtime)
        uses: actions/cache@v4
        with:
          path: ThirdParty/.cache
          key: nodejs-mobile-v18.20.4-8c5ca3a0d1e38de7
      - name: Fetch embedded Node runtime (iOS) and generate project
        run: |
          python3 Scripts/fetch_nodejs_mobile.py
          xcodegen generate
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build iOS (simulator, unsigned)
        run: |
          xcodebuild build \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_IOS" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Build macOS (unsigned)
        run: |
          xcodebuild build \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_MACOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  # 产出**未签名 IPA**：实机验证是唯一能给出真实性能/观感的方式，
  # 而在 Windows 上用 Sideloadly / AltStore 侧载不需要 Mac（见 docs/构建与分发.md 第四节）。
  ipa:
    name: Unsigned IPA (sideload artifact)
    runs-on: macos-15
    needs: [core-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Cache nodejs-mobile (embedded Node runtime)
        uses: actions/cache@v4
        with:
          path: ThirdParty/.cache
          key: nodejs-mobile-v18.20.4-8c5ca3a0d1e38de7
      - name: Fetch embedded Node runtime (iOS) and generate project
        run: |
          python3 Scripts/fetch_nodejs_mobile.py
          xcodegen generate
      - name: Archive iOS (unsigned) and package IPA
        run: |
          xcodebuild archive \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_IOS" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/YPlayer-iOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/YPlayer-iOS.xcarchive/Products/Applications/YPlayer.app build/Payload/
          cd build && zip -qry YPlayer-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YPlayer-unsigned-ipa
          path: build/YPlayer-unsigned.ipa
          if-no-files-found: error

  release:
    name: Release (unsigned ipa / mac app)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Cache nodejs-mobile (embedded Node runtime)
        uses: actions/cache@v4
        with:
          path: ThirdParty/.cache
          key: nodejs-mobile-v18.20.4-8c5ca3a0d1e38de7
      - name: Fetch embedded Node runtime (iOS) and generate project
        run: |
          python3 Scripts/fetch_nodejs_mobile.py
          xcodegen generate
      - name: Archive iOS (unsigned)
        run: |
          xcodebuild archive \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_IOS" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/YPlayer-iOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/YPlayer-iOS.xcarchive/Products/Applications/YPlayer.app build/Payload/
          cd build && zip -qry YPlayer-unsigned.ipa Payload
      - name: Build macOS app (unsigned)
        run: |
          xcodebuild build \
            -project YPlayer.xcodeproj \
            -scheme "$SCHEME_MACOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd build/DerivedData/Build/Products/Release && zip -qry ../../../YPlayer-macOS-unsigned.zip YPlayer.app
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YPlayer-${{ github.ref_name }}
          path: |
            build/YPlayer-unsigned.ipa
            build/YPlayer-macOS-unsigned.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/YPlayer-unsigned.ipa
            build/YPlayer-macOS-unsigned.zip
          body: |
            未签名构建产物（非 App Store 分发）。

            - `YPlayer-unsigned.ipa`：iOS/iPadOS，需自行侧载并重签
            - `YPlayer-macOS-unsigned.zip`：macOS 13+，首次打开需右键“打开”

            本仓库不内置任何影视源，所有接口由使用者自行添加，责任自负。
